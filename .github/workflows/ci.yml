name: Build for CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [ "main" ]

jobs:
  build-plugin-ci:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.x

    - name: Build
      run: dotnet build src\Plugin.Maui.UITestHelpers.slnx -c Release

    - name: Pack
      run: dotnet pack src\Plugin.Maui.UITestHelpers.slnx -c Release --no-build -p:PackageVersion=1.0.0-ci.${{ github.run_number }} -o ${{ github.workspace }}\packages

    - name: Upload NuGet packages
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: ${{ github.workspace }}\packages\*.nupkg
