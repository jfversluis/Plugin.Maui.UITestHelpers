name: Build for CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [ "main" ]

jobs:
  build-plugin-ci:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.x

    - name: Build
      run: dotnet build src\Plugin.Maui.UITestHelpers.slnx -c Release

    - name: Test REPL
      run: dotnet test tests\Plugin.Maui.UITestHelpers.Repl.Tests -c Release
