name: Run UI Tests iOS

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [ "main" ]

env:
  # Release builds don't run on the Simulator
  BUILD_CONFIGURATION: Debug
  CSPROJ_TO_BUILD: samples/Plugin.Maui.UITestHelpers.Sample/Plugin.Maui.UITestHelpers.Sample.csproj
  APP_TO_TEST: samples/Plugin.Maui.UITestHelpers.Sample/bin/Debug/net11.0-ios/iossimulator-arm64/Plugin.Maui.UITestHelpers.Sample.app
  CSPROJ_TO_TEST: samples/UITests.iOS/UITests.iOS.csproj
  APP_ID: com.companyname.uitesthelperssample
  TARGET_FRAMEWORK: net11.0-ios
  XCODE_VERSION: 27.2
  TEST_SIM_NAME: UITestSim
  SCREENCAPTURE_FOLDER: samples/UITests.iOS/bin/Debug/net11.0
  ARTIFACTS_PATH: ${{ github.workspace }}/output

jobs:
  ui-test-ios:

    # xcode-27 has the latest Xcode versions installed; revert to macos-latest as soon as the
    # macOS runners also have Xcode 27
    runs-on: xcode-27

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.x

    - name: Select Xcode version
      run: sudo xcode-select -s '/Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer'

    - name: Create and start iOS Simulator
      # This creates a iPhone 17 Pro Simulator with iOS 27.2
      run: |
        simudid=$(xcrun simctl create "$TEST_SIM_NAME" com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro com.apple.CoreSimulator.SimRuntime.iOS-27-2)
        echo "SIM_UDID=$simudid" >> "$GITHUB_ENV"
        echo "Created Simulator UDID: $simudid"
        # Boot in the background; the 'Install App' step waits for it to finish
        nohup xcrun simctl bootstatus "$simudid" -b > "$RUNNER_TEMP/sim-boot.log" 2>&1 &

    - name: Restore Workload
      run: dotnet workload restore --project ${{ env.CSPROJ_TO_BUILD }}

    - name: Build App
      run: dotnet build ${{ env.CSPROJ_TO_BUILD }} -f ${{ env.TARGET_FRAMEWORK }} -c ${{ env.BUILD_CONFIGURATION }}

    - name: Install Appium
      run: |
        npm install -g appium@3
        appium driver install xcuitest

    - name: Install App
      run: |
        # Wait until the Simulator has fully finished booting, so Appium finds it ready
        xcrun simctl bootstatus "$SIM_UDID" -b
        xcrun simctl install "$SIM_UDID" "$APP_TO_TEST"

    - name: Run UI Tests
      # We're passing on the values we used to create the Simulator with to the test project to find the correct one
      run: |
        dotnet test ${{ env.CSPROJ_TO_TEST }} \
        --logger "console;verbosity=normal" \
        --environment SIMNAME="${{ env.TEST_SIM_NAME }}" \
        --environment SIMID="${{ env.SIM_UDID }}" \
        --environment APPIUM_LOG_FILE=${{ env.ARTIFACTS_PATH }}/appium-logs/appium.log \
        --environment APPID="${{ env.APP_ID }}"

    - name: Publish Artifacts
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: logs-and-screenshots
        path: |
          ${{ env.ARTIFACTS_PATH }}/**/*.*
          ${{ env.SCREENCAPTURE_FOLDER }}/*.png
