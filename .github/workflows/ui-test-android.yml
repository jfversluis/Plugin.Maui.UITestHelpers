name: Run UI Tests Android

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [ "main" ]

env:
  BUILD_CONFIGURATION: Release
  CSPROJ_TO_BUILD: samples/Plugin.Maui.UITestHelpers.Sample/Plugin.Maui.UITestHelpers.Sample.csproj
  APP_TO_TEST: samples/Plugin.Maui.UITestHelpers.Sample/bin/Release/net11.0-android/com.companyname.uitesthelperssample-Signed.apk
  CSPROJ_TO_TEST: samples/UITests.Android/UITests.Android.csproj
  APP_ID: com.companyname.uitesthelperssample
  TARGET_FRAMEWORK: net11.0-android
  TEST_EMULATOR_NAME: UITestEmu
  ANDROID_EMULATOR_IMAGE: system-images;android-37.2;google_apis_ps16k;x86_64
  SCREENCAPTURE_FOLDER: samples/UITests.Android/bin/Debug/net11.0
  ARTIFACTS_PATH: ${{ github.workspace }}/output

jobs:
  ui-test-android:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.x

    - name: Restore Tools
      run: dotnet tool restore

    - name: Restore Workload
      run: dotnet workload restore --project ${{ env.CSPROJ_TO_BUILD }}

    - name: Publish APK
      run: dotnet publish ${{ env.CSPROJ_TO_BUILD }} -f ${{ env.TARGET_FRAMEWORK }}

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Boot Android emulator
      timeout-minutes: 15
      run: |
        export ANDROID_AVD_HOME="$HOME/.android/avd"
        mkdir -p "$ANDROID_AVD_HOME"

        dotnet android sdk list --available

        dotnet android sdk install --package "$ANDROID_EMULATOR_IMAGE"
        dotnet android avd create --name "$TEST_EMULATOR_NAME" --sdk "$ANDROID_EMULATOR_IMAGE" --force
        dotnet android avd start --name "$TEST_EMULATOR_NAME" --wait-boot --timeout 600 --gpu guest --no-snapshot --no-audio --no-boot-anim --no-window

        # Fail if no device booted (older AndroidSdk.Tool versions exit with 0 on a failed start)
        "$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | grep -q 1

        dotnet android device list

    - name: Install App
      run: dotnet android device install --package ${{ env.APP_TO_TEST }}

    - name: Install Appium
      run: |
        npm install -g appium@3
        appium driver install uiautomator2

    - name: Run UI Tests
      run: dotnet test ${{ env.CSPROJ_TO_TEST }} --environment APPIUM_LOG_FILE=${{ env.ARTIFACTS_PATH }}/appium-logs/appium.log --environment APPID="${{ env.APP_ID }}"

    - name: Publish Artifacts
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: logs-and-screenshots
        path: |
          ${{ env.ARTIFACTS_PATH }}/**/*.*
          ${{ env.SCREENCAPTURE_FOLDER }}/*.png